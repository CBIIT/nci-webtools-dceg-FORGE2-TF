name: Deploy Serverless Infrastructure

# Serverless (ECS Fargate) infrastructure provisioning via AWS CDK:
# ECS service, EFS filesystem + access points, ALB target group / listener rule,
# log group, autoscaling schedule, and SSM parameters consumed by Deploy
# Serverless App. Distinct from the EC2 pipeline (forge2-tf-deploy.yml).
# Choose the CDK implementation language (TypeScript or Python) at run time.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod
      iac_language:
        description: "CDK implementation to use"
        required: true
        default: "typescript"
        type: choice
        options:
          - typescript
          - python

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TIER: ${{ inputs.tier }}
      CICD_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd

    steps:
      - uses: "actions/checkout@v6.0.2"
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: ${{ env.TIER }}-forge2-tf-infra-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select IaC language
        run: |
          if [ "${{ inputs.iac_language }}" = "python" ]; then
            echo "CDK_DIR=infrastructure-python" >> "$GITHUB_ENV"
            echo "CDK_APP=python3 app.py" >> "$GITHUB_ENV"
            # Python path uses the globally-installed CDK CLI.
            echo "CDK_EXEC=cdk" >> "$GITHUB_ENV"
          else
            echo "CDK_DIR=infrastructure" >> "$GITHUB_ENV"
            echo "CDK_APP=npx ts-node bin/cdk.ts" >> "$GITHUB_ENV"
            # TypeScript path uses the CDK CLI from local devDependencies.
            echo "CDK_EXEC=npx cdk" >> "$GITHUB_ENV"
          fi

      - name: Download env file from S3
        run: |
          aws s3 cp \
            "s3://${{ vars.CICD_BUCKET }}/env/${{ env.TIER }}/forge2-tf/cdk.env" \
            "${{ env.CDK_DIR }}/cdk.env"

      - name: Load CDK environment variables
        working-directory: ${{ env.CDK_DIR }}
        run: |
          set -a
          source cdk.env
          set +a

          while IFS='=' read -r key _; do
            [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
            echo "${key}=${!key}" >> "$GITHUB_ENV"
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' cdk.env)

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"

      - name: Install TypeScript dependencies
        if: ${{ inputs.iac_language == 'typescript' }}
        working-directory: ${{ env.CDK_DIR }}
        run: npm ci

      - name: Set up Python
        if: ${{ inputs.iac_language == 'python' }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies (CDK CLI + libs)
        if: ${{ inputs.iac_language == 'python' }}
        working-directory: ${{ env.CDK_DIR }}
        run: |
          npm install -g aws-cdk
          pip install -r requirements.txt

      - name: CDK diff (preview changes)
        working-directory: ${{ env.CDK_DIR }}
        run: ${{ env.CDK_EXEC }} diff --app "${{ env.CDK_APP }}" || true

      - name: CDK deploy
        working-directory: ${{ env.CDK_DIR }}
        run: ${{ env.CDK_EXEC }} deploy --app "${{ env.CDK_APP }}" --require-approval never

      - name: Clean up env files
        if: always()
        working-directory: ${{ env.CDK_DIR }}
        run: rm -f cdk.env

      - name: Deployment Summary
        run: |
          echo "## Serverless Infrastructure Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.TIER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **IaC language:** ${{ inputs.iac_language }}" >> $GITHUB_STEP_SUMMARY
