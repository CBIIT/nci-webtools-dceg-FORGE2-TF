family: "${ECS_WEB_TASK}"
networkMode: awsvpc
cpu: "${ECS_WEB_TASK_CPU_UNITS}"
memory: "${ECS_WEB_TASK_MEMORY_UNITS}"
executionRoleArn: "${ROLE_ARN}"
taskRoleArn: "${ROLE_ARN}"
requiresCompatibilities:
  - FARGATE
# Reference data on EFS; motif-logos is a subdirectory of the data volume.
volumes:
  - name: data
    efsVolumeConfiguration:
      fileSystemId: "${EFS_FILE_SYSTEM_ID}"
      transitEncryption: ENABLED
      authorizationConfig:
        accessPointId: "${EFS_ACCESS_POINT_ID}"
        iam: ENABLED
  - name: motif-logos
    efsVolumeConfiguration:
      fileSystemId: "${EFS_FILE_SYSTEM_ID}"
      transitEncryption: ENABLED
      authorizationConfig:
        accessPointId: "${EFS_MOTIF_LOGOS_ACCESS_POINT_ID}"
        iam: ENABLED
containerDefinitions:
  # FireLens (fluent-bit) → Datadog
  - name: logs
    image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
    essential: true
    firelensConfiguration:
      type: fluentbit
    memoryReservation: 50
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: "/analysistools/${TIER}/${APP}/web"
        awslogs-region: "${AWS_REGION}"
        awslogs-stream-prefix: logs

  # Node backend
  - name: backend
    image: "${BACKEND_IMAGE_LATEST}"
    essential: true
    portMappings:
      - protocol: tcp
        containerPort: ${BACKEND_CONTAINER_PORT}
    environment:
      - name: NODE_ENV
        value: production
      - name: SERVER_PORT
        value: "${BACKEND_CONTAINER_PORT}"
      - name: DATA_FOLDER
        value: "${DATA_FOLDER}"
      - name: TMP_FOLDER
        value: "${TMP_FOLDER}"
      - name: LOG_LEVEL
        value: info
      - name: AWS_REGION
        value: "${AWS_REGION}"
      - name: S3_BUCKET
        value: "${S3_BUCKET}"
      - name: S3_SUBFOLDER
        value: "${APP}"
    mountPoints:
      - sourceVolume: data
        containerPath: /deploy/data
        readOnly: false
    logConfiguration:
      logDriver: awsfirelens
      options:
        Name: datadog
        tls: "on"
        tls.verify: "off"
        dd_service: "${TIER}-${APP}-backend"
        dd_source: "nodejs"
        dd_tags: "project:${APP} tier:${TIER}"
        provider: ecs
      secretOptions:
        - name: Host
          valueFrom: /analysistools/${TIER}/datadog/log_endpoint_host
        - name: apikey
          valueFrom: /analysistools/${TIER}/datadog/api_key

  # Apache frontend
  - name: frontend
    image: "${FRONTEND_IMAGE_LATEST}"
    essential: true
    dependsOn:
      - containerName: backend
        condition: START
    portMappings:
      - protocol: tcp
        containerPort: ${WEB_CONTAINER_PORT}
    environment:
      - name: API_HOST
        value: "http://localhost:${BACKEND_CONTAINER_PORT}"
    mountPoints:
      - sourceVolume: motif-logos
        containerPath: /var/www/html/forge2-tf/assets/motif-logos
        readOnly: true
    logConfiguration:
      logDriver: awsfirelens
      options:
        Name: datadog
        tls: "on"
        tls.verify: "off"
        dd_service: "${TIER}-${APP}-frontend"
        dd_source: "httpd"
        dd_tags: "project:${APP} tier:${TIER}"
        provider: ecs
      secretOptions:
        - name: Host
          valueFrom: /analysistools/${TIER}/datadog/log_endpoint_host
        - name: apikey
          valueFrom: /analysistools/${TIER}/datadog/api_key
tags:
  - key: Project
    value: dceg-analysistools
  - key: ApplicationName
    value: "${APP}"
  - key: ResourceName
    value: "${TIER}-${APP}-web-task"
  - key: EnvironmentTier
    value: "${ENVIRONMENT_TIER}"
  - key: ResourceFunction
    value: compute
