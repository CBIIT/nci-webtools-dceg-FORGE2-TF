family: "${SYNC_TASK}"
networkMode: awsvpc
cpu: "512"
memory: "1024"
executionRoleArn: "${ROLE_ARN}"
taskRoleArn: "${ROLE_ARN}"
requiresCompatibilities:
  - FARGATE
# Mount the data and motif-logos access points on the shared EFS filesystem. Each
# volume authorizes through its own access point (a raw rootDirectory mount is denied).
volumes:
  - name: data
    efsVolumeConfiguration:
      fileSystemId: "${EFS_FILE_SYSTEM_ID}"
      transitEncryption: ENABLED
      authorizationConfig:
        accessPointId: "${EFS_ACCESS_POINT_ID}"
        iam: ENABLED
  - name: motif-logos
    efsVolumeConfiguration:
      fileSystemId: "${EFS_FILE_SYSTEM_ID}"
      transitEncryption: ENABLED
      authorizationConfig:
        accessPointId: "${EFS_MOTIF_LOGOS_ACCESS_POINT_ID}"
        iam: ENABLED
containerDefinitions:
  - name: sync
    image: public.ecr.aws/aws-cli/aws-cli:latest
    essential: true
    entryPoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws s3 sync "${DATA_S3_URI}" /data/ &&
        aws s3 sync "${MOTIF_LOGOS_S3_URI}" /motif-logos/
    mountPoints:
      - sourceVolume: data
        containerPath: "/data"
        readOnly: false
      - sourceVolume: motif-logos
        containerPath: "/motif-logos"
        readOnly: false
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: "/analysistools/${TIER}/${APP}/sync"
        awslogs-region: "${AWS_REGION}"
        awslogs-stream-prefix: sync
        awslogs-create-group: "true"
tags:
  - key: Project
    value: dceg-analysistools
  - key: ApplicationName
    value: "${APP}"
  - key: ResourceName
    value: "${TIER}-${APP}-sync-ecs-task"
  - key: EnvironmentTier
    value: "${ENVIRONMENT_TIER}"
  - key: ResourceFunction
    value: compute
