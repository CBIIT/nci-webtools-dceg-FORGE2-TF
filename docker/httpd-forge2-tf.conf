ProxyPass "/forge2-tf/api" "${API_HOST}/api/"
ProxyPassReverse "/forge2-tf/api" "${API_HOST}/api/"

ServerSignature Off
ServerTokens Prod

LogFormat "%h %{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

<IfModule headers_module>

 # Enforce https
  <If "%{HTTP:X-Forwarded-Proto} == 'https'">
    Header set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
  </If>

  # The SPA shell must never be cached. index.html references content-hashed
  # bundles (static/js/main.<hash>.chunk.js); a stale cached index.html — at the
  # browser or the analysistools-*.cancer.gov edge — serves an old app that
  # talks to the wrong backend. The hashed assets themselves stay cacheable.
  <FilesMatch "^index\.html$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires "0"
  </FilesMatch>

</IfModule>